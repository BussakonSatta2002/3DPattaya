name: Deploy Vite site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Download 3D release assets
        run: |
          curl -L --fail --retry 3 \
            -o public/pattaya.splat \
            https://github.com/BussakonSatta2002/3DPattaya/releases/download/v1.0.0/pattaya.splat

          curl -L --fail --retry 3 \
            -o public/output_pattaya577.collision.glb \
            https://github.com/BussakonSatta2002/3DPattaya/releases/download/v1.0.0/output_pattaya577.collision.glb
      - name: Build Vite application
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
